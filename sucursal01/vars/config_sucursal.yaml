---
# Variables de configuración para Sucursal 01
# Según documento: Actividad_automatizacion_y_auditoria_sucursal.pdf

# VLANs requeridas
vlans:
  - id: 10
    name: USUARIOS_VLAN10
  - id: 20
    name: USUARIOS_VLAN20
  - id: 99
    name: GESTION

# Red de gestión
gestion_network: 192.168.99.0/24
gestion_gateway: 192.168.99.1

# Direcciones IP de gestión de switches
switches:
  SW-SUC-01-CORE:
    ip: 192.168.99.2
    mask: 255.255.255.0
  SW-SUC-01-ACC1:
    ip: 192.168.99.3
    mask: 255.255.255.0

# Troncales
trunks:
  SW-SUC-01-CORE:
    Gi0/0:
      tipo: troncal
      nativa: 99
      permitidas: [10, 20, 99]
      descripcion: Troncal hacia R-SUC-01
    Gi1/2:
      tipo: troncal
      nativa: 99
      permitidas: [10, 20, 99]
      descripcion: Troncal hacia SW-SUC-01-ACC1

  SW-SUC-01-ACC1:
    Gi0/0:
      tipo: troncal
      nativa: 99
      permitidas: [10, 20, 99]
      descripcion: Troncal hacia SW-SUC-01-CORE

# Puertos de acceso
acceso:
  SW-SUC-01-CORE:
    Gi0/1:
      vlan: 10
      descripcion: PC1 - VLAN 10
    Gi0/2:
      vlan: 10
      descripcion: PC2 - VLAN 10
    Gi1/0:
      vlan: 20
      descripcion: PC3 - VLAN 20
    Gi1/1:
      vlan: 20
      descripcion: PC4 - VLAN 20
    Gi0/3:
      vlan: 99
      descripcion: Gestion - VLAN 99

  SW-SUC-01-ACC1:
    Gi0/1:
      vlan: 10
      descripcion: PC5 - VLAN 10
    Gi0/2:
      vlan: 20
      descripcion: PC6 - VLAN 20
    Gi0/3:
      vlan: 99
      descripcion: PC8 - VLAN 99

# Router - Subinterfaces
router_subinterfaces:
  Gi0/0:
    subinterfaces:
      - id: 10
        encapsulation: "dot1Q 10"
        ip: 192.168.10.1
        mask: 255.255.255.0
      - id: 20
        encapsulation: "dot1Q 20"
        ip: 192.168.20.1
        mask: 255.255.255.0
      - id: 99
        encapsulation: "dot1Q 99 native"
        ip: 192.168.99.1
        mask: 255.255.255.0
